<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0813"/>
      <stop offset="50%" stop-color="#1a0e23"/>
      <stop offset="100%" stop-color="#2a0f1d"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c59b4c"/>
      <stop offset="30%" stop-color="#f3e7be"/>
      <stop offset="50%" stop-color="#dfb76c"/>
      <stop offset="70%" stop-color="#fdf3cd"/>
      <stop offset="100%" stop-color="#b88737"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e25c80"/>
      <stop offset="50%" stop-color="#dfb76c"/>
      <stop offset="100%" stop-color="#8a53c8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .arabic-title {
      font-family: 'Scheherazade New', 'Amiri', 'Traditional Arabic', 'Lateef', serif;
      font-size: 78px;
      font-weight: bold;
      fill: url(#goldGrad);
      text-anchor: middle;
      filter: url(#glow);
    }
    .latin-title {
      font-family: 'Cinzel', 'Trajan Pro', 'Georgia', 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 12px;
      fill: url(#goldGrad);
      text-anchor: middle;
    }
    .sub-title {
      font-family: 'Cinzel', 'Georgia', serif;
      font-size: 15px;
      letter-spacing: 5px;
      fill: #e8d7bb;
      text-anchor: middle;
      opacity: 0.9;
    }
    .poem-quote {
      font-family: 'Baskerville', 'Palatino Linotype', 'Book Antiqua', 'Georgia', serif;
      font-style: italic;
      font-size: 17px;
      fill: #f5eedf;
      text-anchor: middle;
    }
    .poem-author {
      font-family: 'Georgia', serif;
      font-size: 13px;
      letter-spacing: 2px;
      fill: url(#accentGrad);
      text-anchor: middle;
    }
    .ornament {
      stroke: url(#goldGrad);
      fill: none;
      stroke-width: 1.5;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Ornate Outer Frame -->
  <rect x="20" y="20" width="1160" height="360" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <rect x="28" y="28" width="1144" height="344" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="8,4" opacity="0.5"/>

  <!-- Corner Ornaments (Top-Left) -->
  <path d="M 35 65 L 65 35 M 35 75 L 75 35 M 40 40 L 40 55 M 40 40 L 55 40" class="ornament" opacity="0.8"/>
  <circle cx="48" cy="48" r="3" fill="url(#goldGrad)"/>

  <!-- Corner Ornaments (Top-Right) -->
  <path d="M 1165 65 L 1135 35 M 1165 75 L 1125 35 M 1160 40 L 1160 55 M 1160 40 L 1145 40" class="ornament" opacity="0.8"/>
  <circle cx="1152" cy="48" r="3" fill="url(#goldGrad)"/>

  <!-- Corner Ornaments (Bottom-Left) -->
  <path d="M 35 335 L 65 365 M 35 325 L 75 365 M 40 360 L 40 345 M 40 360 L 55 360" class="ornament" opacity="0.8"/>
  <circle cx="48" cy="352" r="3" fill="url(#goldGrad)"/>

  <!-- Corner Ornaments (Bottom-Right) -->
  <path d="M 1165 335 L 1135 365 M 1165 325 L 1125 365 M 1160 360 L 1160 345 M 1160 360 L 1145 360" class="ornament" opacity="0.8"/>
  <circle cx="1152" cy="352" r="3" fill="url(#goldGrad)"/>

  <!-- Center Geometric Top Crest -->
  <g transform="translate(600, 48)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)"/>
    <line x1="-120" y1="0" x2="-25" y2="0" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="25" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <circle cx="-120" cy="0" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="120" cy="0" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Arabic Main Title -->
  <text x="600" y="145" class="arabic-title">فـصـل فـضـولـی</text>

  <!-- Latin Main Title -->
  <text x="600" y="195" class="latin-title">FASL-I FUZÛLÎ</text>

  <!-- Subtitle -->
  <text x="600" y="228" class="sub-title">DÎVÂN-I FUZÛLÎ DİJİTAL KÜLLİYÂTI &amp; EDEBİYAT PLATFORMU</text>

  <!-- Center Decorative Divider -->
  <g transform="translate(600, 255)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
    <polygon points="0,-6 8,0 0,6 -8,0" fill="url(#goldGrad)"/>
    <circle cx="-50" cy="0" r="2" fill="url(#goldGrad)"/>
    <circle cx="50" cy="0" r="2" fill="url(#goldGrad)"/>
    <circle cx="-150" cy="0" r="2" fill="url(#goldGrad)"/>
    <circle cx="150" cy="0" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Famous Motto / Quote -->
  <text x="600" y="298" class="poem-quote">“Şi'r-i bî-ilm esâssız dîvâr olur ve esâssız dîvâr gâyetde bî-i'tibâr olur.”</text>
  <text x="600" y="325" class="poem-author">— MOLLA MUHAMMED BİN SÜLEYMAN FUZÛLÎ (1483 — 1556) —</text>

  <!-- Bottom Accent Dots -->
  <g transform="translate(600, 355)" opacity="0.6">
    <circle cx="-30" cy="0" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="2" fill="url(#goldGrad)"/>
    <circle cx="30" cy="0" r="1.5" fill="url(#goldGrad)"/>
  </g>
</svg>
